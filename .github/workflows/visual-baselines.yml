# Generates the Linux screenshot baselines that CI compares against.
#
# Manual only. Baselines are pixel-exact per platform, so the macOS PNGs
# committed from a laptop are useless to an Ubuntu runner -- until this has
# run once, the visual step in ci.yml warns instead of comparing, and the
# suite is not actually guarding anything on CI.
#
# Re-run it deliberately after a change that is meant to alter appearance
# (tokens, a shared layout), and review the resulting diff like any other.
name: Update Linux visual baselines

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baselines:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build tokens
        run: pnpm --filter @vianova/tokens build

      - name: Build docs site
        run: pnpm --filter @vianova/www build

      - name: Install Playwright browser
        run: pnpm --filter @vianova/www exec playwright install --with-deps chromium

      - name: Write baselines
        run: pnpm --filter @vianova/www test:visual:update

      # Runs twice on purpose: a baseline that does not reproduce against
      # itself is non-deterministic, and committing it would hand CI a test
      # that fails at random later.
      - name: Verify the new baselines are stable
        run: pnpm --filter @vianova/www test:visual

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'apps/www/e2e/**/*-linux.png'
          if git diff --cached --quiet; then
            echo "No baseline changes."
            exit 0
          fi
          git commit -m "test(visual): update Linux baselines" \
                     -m "Generated by the visual-baselines workflow."
          git push
