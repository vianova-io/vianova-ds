# Generates the Linux screenshot baselines that CI compares against.
#
# Manual only. Baselines are pixel-exact per platform, so the macOS PNGs
# committed from a laptop are useless to an Ubuntu runner -- until this has
# run once, the visual step in ci.yml warns instead of comparing, and the
# suite is not actually guarding anything on CI.
#
# Re-run it deliberately after a change that is meant to alter appearance
# (tokens, a shared layout), and review the resulting diff like any other.
name: Update Linux visual baselines

on:
  workflow_dispatch:
    inputs:
      refresh:
        description: >-
          Optional test-name filter. Those baselines are rewritten even if they
          currently pass; leave empty for the normal update.
        required: false
        type: string

permissions:
  contents: write

jobs:
  baselines:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build tokens
        run: pnpm --filter @vianova/tokens build

      - name: Build docs site
        run: pnpm --filter @vianova/www build

      - name: Install Playwright browser
        run: pnpm --filter @vianova/www exec playwright install --with-deps chromium

      # Two modes, because `--update-snapshots` alone cannot refresh every
      # baseline. It skips any whose diff is inside maxDiffPixelRatio, so a
      # real appearance change under ~1% leaves the Linux PNG frozen at the old
      # render while CI reports green -- ranked-bars-default sat at 0.65% and
      # did exactly that. `refresh` forces the named ones with
      # `--update-snapshots=all`.
      #
      # Deliberately a filter and not a blanket force: forcing all 105 rewrites
      # ~59 of them with sub-perceptual noise that Playwright's own comparator
      # scores at zero, which buries the one real change in churn.
      - name: Write baselines
        env:
          REFRESH: ${{ inputs.refresh }}
        run: |
          if [ -n "$REFRESH" ]; then
            pnpm --filter @vianova/www test:visual:refresh -g "$REFRESH"
          else
            pnpm --filter @vianova/www test:visual:update
          fi

      # Runs twice on purpose: a baseline that does not reproduce against
      # itself is non-deterministic, and committing it would hand CI a test
      # that fails at random later.
      - name: Verify the new baselines are stable
        run: pnpm --filter @vianova/www test:visual

      - name: Commit
        env:
          REFRESH: ${{ inputs.refresh }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'apps/www/e2e/**/*-linux.png'
          if git diff --cached --quiet; then
            echo "No baseline changes."
            exit 0
          fi
          if [ -n "$REFRESH" ]; then
            git commit -m "test(visual): refresh Linux baselines for $REFRESH" \
                       -m "Forced with --update-snapshots=all: the diff was inside" \
                       -m "maxDiffPixelRatio, so a normal update would not rewrite it."
          else
            git commit -m "test(visual): update Linux baselines" \
                       -m "Generated by the visual-baselines workflow."
          fi
          git push
