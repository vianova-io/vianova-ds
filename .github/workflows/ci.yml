name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A push made by GITHUB_TOKEN does not trigger workflows, so anything CI
  # commits for itself -- the Linux baselines, for one -- needs a manual run
  # to be verified against.
  workflow_dispatch:

# The repo default is read-only today, but that is a settings toggle nobody
# reviews. Pinning it here means flipping it to "read and write" cannot
# silently hand this workflow -- and every lifecycle script in the dependency
# tree it installs -- push access to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keeps `next build` from phoning home on every run.
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. The action errors out when the version
      # is pinned in two places, and package.json's packageManager field is the
      # one that also governs local installs.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Tokens first: everything downstream imports the built output.
      - name: Build tokens
        run: pnpm --filter @vianova/tokens build

      - name: "Token tests: Figma parity, WCAG AA, colour-blind safety"
        run: pnpm --filter @vianova/tokens test

      # Guards the generated artefacts against a stale commit: if re-running the
      # import or the registry index changes tracked files, the working tree is
      # dirty and someone forgot to commit generated output.
      - name: Check generated registry manifest is up to date
        run: |
          pnpm --filter @vianova/www registry:index
          if ! git diff --quiet -- apps/www/registry.json; then
            echo "::error::apps/www/registry.json is stale. Run 'pnpm --filter @vianova/www registry:index' and commit the result."
            git diff -- apps/www/registry.json
            exit 1
          fi

      # The e2e matrix picks files with two regexes, one of them a negative
      # lookahead. If a rename stops them partitioning the suite, a spec stops
      # running and nothing goes red -- which is the exact failure the bare
      # `playwright test` was adopted to prevent, so it is guarded rather than
      # trusted. Listing takes about a second and starts no web server.
      - name: The e2e groups still cover every spec
        working-directory: apps/www
        run: |
          heavy='map-workspace-layers\.spec\.ts'
          rest='^(?!.*map-workspace-layers\.spec\.ts).*$'
          count() {
            pnpm exec playwright test ${1:+"$1"} --list 2>/dev/null |
              sed -n 's/^Total: \([0-9]*\) tests.*/\1/p'
          }
          all=$(count) h=$(count "$heavy") r=$(count "$rest")
          echo "all=$all heavy=$h rest=$r"
          if [ -z "$all" ] || [ "$h" -eq 0 ] || [ $((h + r)) -ne "$all" ]; then
            echo "::error::the e2e matrix selectors no longer partition the suite -- $h + $r != $all"
            exit 1
          fi

      - name: Typecheck
        run: pnpm --filter @vianova/www typecheck

      # The filter AST is the only registry code with real logic and no visual
      # coverage -- a screenshot cannot tell you removeNode left an empty group.
      - name: "Unit tests: filter AST"
        run: pnpm --filter @vianova/www test

      - name: Build docs site
        run: pnpm --filter @vianova/www build

      # The only check that exercises the real distribution path end to end.
      # Has already caught an undeclared registryDependency and a type collision.
      - name: Registry consume smoke test
        run: ./scripts/registry-smoke-test.sh

  # ONE step, deliberately.
  #
  # This was seven named steps, one per suite, and the price was a second
  # wiring point: a spec file only ran if someone remembered to add both a
  # package script AND a step here. Eight did not get one --
  # map-workspace-tray, -layers, -library, -colorize, regulations-workspace,
  # feeds-workspace, panel-stepper, preset-picker -- so the most detailed
  # contracts in the repo were guarded by a suite CI never ran, while the
  # checks went green. `playwright test` with no argument runs every spec in
  # e2e/, so a new file is covered the moment it exists. The named scripts
  # stay in package.json for running one suite locally.
  #
  # What the suites are for, kept from the steps they replace:
  #
  #   a11y          axe over every example and block. Every bug it exists
  #                 for was invisible to typecheck and the unit tests:
  #                 blank swatches, hydration mismatches, a silently dead
  #                 map, a component that threw only once its menu opened.
  #   focus-ring    a ring painted outside a control's box is cut by any
  #                 ancestor with overflow != visible. Blocks are crawled
  #                 too -- that is where it was found, by hand.
  #   control-size  heights live in five class strings across five files;
  #                 nothing else measures whether they still agree.
  #   responsive    every other suite runs at the single 900px project
  #                 viewport. This one sets its own and measures the map
  #                 blocks at phone, tablet and desktop.
  #   basemap       the switcher, and the contract that the data ramp
  #                 follows it -- including the attribution that is the
  #                 legal obligation attached to the free tile backends.
  #                 Both backends are stubbed so CI never depends on them.
  #   foundations   the only page the crawls never reach, because they go
  #                 through /preview and /blocks. That is how its swatches
  #                 once shipped 170 contrast failures without going red.
  #   visual        screenshots. Playwright suffixes them per platform, so
  #                 macOS baselines are not used on Linux; a new example
  #                 needs a Linux baseline from the visual-baselines
  #                 workflow before this can pass.
  #   the rest      the map workspace's tray, layers, library and colorize
  #                 chains; the regulations and feeds workspaces; the panel
  #                 stepper; the preset picker.
  #
  # Its own job, and sharded, because of a measured budget rather than taste.
  # Gating those eight files took the suite from the seven wired-up scripts to
  # 556 tests, and the first run was CANCELLED at 20m19s with 501 of them
  # passed and nothing failed -- `timeout-minutes: 20`, not a red test. The
  # 20 minutes, from that run's own step timestamps:
  #
  #   ~1 min   install, tokens, typecheck, unit tests
  #    2 min   next build
  #    5 min   playwright install --with-deps (the apt packages, not Chromium)
  #   13 min   501 tests at 2 workers, then the guillotine
  #
  # Splitting it out keeps `verify` -- typecheck, unit tests, the registry
  # guards -- reporting in 2m38s rather than twenty-two minutes, which is the
  # part of CI anyone waits on. fail-fast is off: one shard's result is wanted
  # even when another has already found something.
  #
  # ## How the work is split
  #
  # Per-file totals, measured from the four shard logs of the run on #19
  # (580 tests, 2390s of work, two workers a job):
  #
  #   map-workspace-layers.spec.ts    944s   26 tests   39% of the whole suite
  #   responsive.spec.ts              237s   68 tests
  #   focus-ring.spec.ts              230s  136 tests
  #   a11y.spec.ts                    185s  130 tests
  #   everything else                 794s  220 tests
  #
  # Playwright balances shards by test COUNT, and sorted, this suite puts every
  # expensive spec next to every other one. Four equal counts therefore gave
  # four wildly unequal times -- shard 3 took 1687s of the 2390, 14.1 min,
  # while the others finished in 2.2, 1.9 and 1.7. It spent most of a year one
  # slow runner away from the 25-minute guillotine, and on #19 it hit it: 25m18s,
  # 87 tests passed, nothing failed, reported as a red check.
  #
  # Raising the shard count does not fix that. The boundaries move; the
  # clustering does not.
  #
  # An earlier note here concluded that a single file was the floor, on the
  # belief that shards are chunks of the FILE list. They are not. With
  # `fullyParallel`, --shard splits by test, inside a file as well:
  #
  #   playwright test map-workspace-layers.spec.ts --list             26 tests
  #   playwright test map-workspace-layers.spec.ts --shard=1/2 --list 13 tests
  #
  # So the split is by cost rather than by count. The one expensive file takes
  # two jobs; everything else takes three, selected by a negative lookahead.
  # That is the part worth guarding: the "rest" group is defined by exclusion,
  # so A NEW SPEC IS COVERED THE MOMENT IT EXISTS, which is the property the
  # bare `playwright test` was adopted for and the one a hand-written file list
  # would have thrown away. `verify` asserts the two selectors still partition
  # the suite, in about a second, so a rename cannot quietly drop a file out of
  # CI -- the failure this whole arrangement exists to prevent.
  #
  # Expected from those measurements: 472s, 472s, 482s, 482s, 482s -- about
  # 4 min of tests a job against 14.1. One more runner than before, which is
  # now worth it; it was not while one file was believed to be indivisible.
  #
  # Deliberately NOT changed here, both separate jobs of work:
  #
  #   - Each job runs 2 workers, Playwright's default of half the runner's 4
  #     cores. Doubling it is the next obvious lever and needs its own
  #     measurement; map-workspace-layers already carries a 90s timeout that
  #     the comment at its head blames on four workers sharing a machine.
  #   - map-workspace-layers is expensive because `open()` re-adds all eleven
  #     catalogue layers through the dialog before EACH test -- about 9.5s of
  #     every test, paid 26 times -- restoring a precondition the data library
  #     removed rather than being rewritten. That is a rewrite of 26 tests.
  e2e:
    name: e2e (${{ matrix.group }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # The one file that is 39% of the suite, split in half.
          - group: layers
            select: 'map-workspace-layers\.spec\.ts'
            shard: 1/2
          - group: layers
            select: 'map-workspace-layers\.spec\.ts'
            shard: 2/2
          # Everything else, by exclusion rather than by name.
          - group: rest
            select: '^(?!.*map-workspace-layers\.spec\.ts).*$'
            shard: 1/3
          - group: rest
            select: '^(?!.*map-workspace-layers\.spec\.ts).*$'
            shard: 2/3
          - group: rest
            select: '^(?!.*map-workspace-layers\.spec\.ts).*$'
            shard: 3/3
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build tokens
        run: pnpm --filter @vianova/tokens build

      # The suites run against the exported files, so the export has to exist.
      - name: Build docs site
        run: pnpm --filter @vianova/www build

      - name: Install Playwright browser
        run: pnpm --filter @vianova/www exec playwright install --with-deps chromium

      # `exec playwright test`, not the test:e2e script with `-- --shard=`.
      #
      # Measured, because the obvious form fails silently. pnpm forwards the
      # `--` itself to the script -- `typecheck -- --version` runs
      # `tsc --noEmit -- --version` and tsc says "Unknown compiler option
      # '--'" -- and playwright does not error on it, it ignores every
      # argument after it:
      #
      #   playwright test --shard=1/2 --list     Total: 2 tests in 1 file
      #   playwright test -- --shard=1/2 --list  2 passed (315ms)
      #
      # The second did not list and did not shard. So `test:e2e -- --shard=`
      # would have run all 556 tests in BOTH shards and timed out twice,
      # reported as two unexplained cancellations. The script stays in
      # package.json for local use; it is the same bare `playwright test`.
      # The positional argument is a regex matched against each spec's PATH,
      # which is what makes the "rest" group expressible as a lookahead.
      - name: "End-to-end: ${{ matrix.group }} ${{ matrix.shard }}"
        run: pnpm --filter @vianova/www exec playwright test "${{ matrix.select }}" --shard=${{ matrix.shard }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # Per shard: two jobs uploading one name is a collision, and the
          # artifact that loses is the evidence.
          # job-index, not the shard: "1/3" is not a legal artifact name, and
          # two groups both have a shard 1.
          name: playwright-report-${{ matrix.group }}-${{ strategy.job-index }}
          path: apps/www/playwright-report
          retention-days: 7

  # Everything in `verify` runs against the export served from the domain ROOT,
  # which is the right default -- it keeps five suites working with no spec
  # changes. But the site actually deploys under /vianova-ds, and `basePath`
  # does not rewrite raw src/href strings, so an asset 404 is a deployed-only
  # failure that no root-served test can see. Two of those are silent: the
  # maplibre worker renders an empty map reporting no error, and an
  # `<a download>` at a 404 saves an empty file.
  #
  # A parallel job, so wall clock is unchanged; it costs a second build.
  pages-shape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `build` does not build the tokens package; registry:build reads its
      # dist/registry-theme.json.
      - name: Build tokens
        run: pnpm --filter @vianova/tokens build

      - name: Build the site as GitHub Pages will serve it
        run: pnpm --filter @vianova/www build
        env:
          NEXT_PUBLIC_BASE_PATH: /vianova-ds

      # Browserless, ~1s: literal src/href attributes in the built HTML.
      - name: No unprefixed asset paths in the export
        run: pnpm --filter @vianova/www check:export
        env:
          NEXT_PUBLIC_BASE_PATH: /vianova-ds

      - name: Install Playwright browser
        run: pnpm --filter @vianova/www exec playwright install --with-deps chromium

      # The other half: real network requests, including URLs built in JS that
      # the static scan cannot see.
      - name: Every asset resolves under the basePath
        run: pnpm --filter @vianova/www test:pages
        env:
          NEXT_PUBLIC_BASE_PATH: /vianova-ds
